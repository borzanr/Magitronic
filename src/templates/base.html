<script>
/* escolhe o tema antes de pintar: preferência salva, senão a do sistema */
(function () {
  var raiz = document.documentElement, salvo = null;
  try { salvo = localStorage.getItem('mg-tema'); } catch (e) {}
  var tema = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  raiz.setAttribute('data-theme', tema);
  raiz.style.colorScheme = tema;
})();
</script>
<link rel="stylesheet" href="/assets/css/site.css?v=[[v]]">
[[theme_css]]
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied', wait_for_update: 500});
try { if (localStorage.getItem('mg-consent') === 'granted') gtag('consent', 'update', {ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'}); } catch (e) {}
</script>
[[gtm_head]]
<script src="/assets/js/site.js?v=[[v]]" defer></script>
